[defaults]
# Paths here are resolved relative to this file, so the playbook works from any directory
# as long as Ansible loads this file (export ANSIBLE_CONFIG=ansible/ansible.cfg -- see README).
inventory = ./inventory.ini
# SSH host-key checking is ENABLED (protects against man-in-the-middle). The server's key must be in
# ~/.ssh/known_hosts - see ANSIBLE-DEPLOYMENT-README.md ("Trusting the server's host key").
host_key_checking = true
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
# Deploy to up to 10 hosts in parallel.
forks = 10
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
retries = 3