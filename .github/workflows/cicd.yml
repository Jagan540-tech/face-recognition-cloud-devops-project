name: Face Recognition CI/CD

# CI  (every push and pull request to main): compile check, pytest, Ansible syntax check, Terraform
#     fmt/validate (no backend, no AWS), Docker build + container smoke test (/health).
# CD  (push to main, or a manual run on main, and ONLY if CI passed):
#       push image to private ECR  ->  deploy to EC2 with the existing Ansible playbook.
# Setup needed in GitHub / AWS (secrets, OIDC role): see README.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job gets read-only repository access by default. Only the two jobs that
# talk to AWS (push-to-ecr, deploy) additionally request id-token: write for GitHub OIDC.
permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "080705554676"
  ECR_REPOSITORY: face-recognition-system

jobs:
  # ------------------------------------------------------------------ CI
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Python compilation check
        run: python -m compileall -q app.py config.py backend scripts tests

      - name: Download and verify face models
        run: python scripts/download_models.py --dir models

      # No AWS credentials exist in this job: the S3 tests use an in-memory fake client.
      - name: Run tests
        run: python -m pytest -v

      # Syntax check only: nothing is executed against any server.
      - name: Ansible syntax check
        run: |
          python -m pip install "ansible-core>=2.17,<2.19"
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook -i localhost, --syntax-check ansible/deploy.yml

      # Static validation only: -backend=false means no state, no AWS credentials, no plan, no apply.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt, init (no backend) and validate
        working-directory: terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t face-recognition-system:ci .

      # Starts the image that was just built (S3 disabled: no AWS in CI) and requires /health = 200.
      - name: Smoke test - start the container and call /health
        run: |
          set -euo pipefail
          docker run -d --name fr-smoke -p 127.0.0.1:5000:5000 -e FR_S3_BUCKET= face-recognition-system:ci
          for i in $(seq 1 30); do
            if body="$(curl -fsS --max-time 3 http://127.0.0.1:5000/health 2>/dev/null)"; then
              echo "Attempt $i: $body"
              echo "$body" | grep -q '"healthy"' && exit 0
            fi
            echo "Attempt $i: not ready yet"
            sleep 2
          done
          echo "::error::The container did not become healthy within 60 seconds"
          exit 1

      - name: Show container logs and state (only if the smoke test failed)
        if: failure()
        run: |
          docker ps -a --filter name=fr-smoke || true
          docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' fr-smoke || true
          docker logs --tail 100 fr-smoke || true

      - name: Stop and remove the smoke-test container
        if: always()
        run: docker rm -f fr-smoke || true

  # ------------------------------------------------------------------ CD: build + push to ECR
  push-to-ecr:
    name: Push Image to ECR
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # lets the job ask AWS for short-lived credentials (OIDC); no stored keys

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image (commit SHA + latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ CD: deploy with the existing playbook
  deploy:
    name: Deploy to EC2 (Ansible)
    needs: push-to-ecr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # only used when EC2_SECURITY_GROUP_ID is set (temporary SSH rule below)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install "ansible-core>=2.17,<2.19"

      # Optional. GitHub runners have changing IPs, so port 22 is opened to THIS runner only, for
      # the duration of the deployment, and closed again at the end. Skipped unless the repository
      # variable EC2_SECURITY_GROUP_ID is set (see README.md).
      - name: Configure AWS credentials for the temporary SSH rule
        if: vars.EC2_SECURITY_GROUP_ID != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Open SSH for this runner only
        if: vars.EC2_SECURITY_GROUP_ID != ''
        env:
          SG_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          test -n "$RUNNER_IP" || { echo "::error::Could not determine the runner's public IP"; exit 1; }
          aws ec2 authorize-security-group-ingress --region "$AWS_REGION" \
            --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"
          # Only now does a rule exist, so only now does the cleanup step have something to remove.
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"

      - name: Prepare SSH key and inventory (kept only on this runner)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" && test -n "$EC2_SSH_PRIVATE_KEY" || { echo "::error::Secrets EC2_HOST and EC2_SSH_PRIVATE_KEY must be set"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/ec2_deploy_key"
          chmod 600 "$HOME/.ssh/ec2_deploy_key"

          # ansible/inventory.ini is git-ignored; build it here.
          {
            echo "[face_recognition]"
            echo "face-server ansible_host=${EC2_HOST} ansible_user=ec2-user ansible_ssh_private_key_file=$HOME/.ssh/ec2_deploy_key"
          } > ansible/inventory.ini


      - name: Deploy the image that was just pushed (existing playbook, unchanged flow)
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_FORCE_COLOR: "1"
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}   # optional; used only if a certificate has to be issued
        run: ansible-playbook ansible/deploy.yml -e "image_tag=${{ github.sha }}"

      # The playbook already verifies the container, /health, HTTPS and the redirect ON the server.
      # This optional step additionally checks the public URL from the outside (DNS, firewall, Nginx).
      # Enable it by creating the repository variable APP_URL, e.g. https://facerecognition.jaganops.in
      - name: Verify the application from the internet (optional)
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            --max-time 20 "${APP_URL%/}/health"
          echo

      - name: Remove SSH key and inventory
        if: always()
        run: rm -f "$HOME/.ssh/ec2_deploy_key" "$HOME/.ssh/known_hosts" ansible/inventory.ini

      - name: Close the temporary SSH rule
        if: always()
        env:
          SG_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress --region "$AWS_REGION" \
              --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"
            echo "Temporary SSH rule removed successfully."
          else
            echo "No temporary SSH rule was created; nothing to remove."
          fi